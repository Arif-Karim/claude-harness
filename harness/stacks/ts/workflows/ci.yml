# harness:managed ci (agent-harness). Job names are the required checks in harness.config.json.
# Several stacks: harness-init merges each stack's "# >>> harness:<block>" sections into one file.
name: ci

on:
  pull_request:
  push:
    branches: ["{{DEFAULT_BRANCH}}"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # >>> harness:setup-verify
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: {{TS_DIR}}/package-lock.json
      # <<< harness:setup-verify
      - name: verify
        run: scripts/verify.sh

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # >>> harness:setup-mutation
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: {{TS_DIR}}/package-lock.json
      - name: "ts: npm ci"
        run: npm ci
        working-directory: {{TS_DIR}}
      # <<< harness:setup-mutation
      # >>> harness:run-mutation
      - name: "ts: mutation test changed files (Stryker)"
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: scripts/mutation-ts.sh
      # <<< harness:run-mutation

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --no-banner --redact
